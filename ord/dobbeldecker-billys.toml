ord = "Dobbeldecker Billys"
nynorsk = "To plans Billi"
stikkord = "Herremåltid"
definisjon = """
Hvis du noen gang er ekstra sulten i [[kiosken|elektrakiosken]] så holder
det ikke med én Billys. Ja du kan spise to på vanlig måte, men det finnes en
