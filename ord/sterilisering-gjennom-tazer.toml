ord = "Sterilisering gjennom tazer"
nynorsk = "Sterilisering gjennam tazer"
stikkord = "Straff"
definisjon = """
Etter en hendelse i [[fadderuken|fadderuka]] 22, ble det besluttet at et
sittende styremedlem hadde utvist grov uaktsomhet. Dette medlemmet ble da,
som straff, tazet i sine testikler på scenen under 15 års
[[jubb-ballet|jubb]]. Ved [[KHSK|kulturell-hoyspentkveld]] 23 ble den samme
straffen, på det samme styremedlemmet(nå avgått), auksjonert bort. Et annet
tidligere styremedlem betalte gode penger for dette privileget, noe som
resulterte i en ny runde med [[tazeren|tazer]] under [[immeball]] 23. Det er
uvisst om dette har gitt varige mén.
"""
