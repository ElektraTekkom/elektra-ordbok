definisjon = """
Thevenins tjenere er en strengt hemmelig orden som utpeker de medlemmene som
har gjort seg fortjent til å slås til [[Ridder av Elektra]]. Består av
medlemmer som allerede er ridder og er som sagt veldig hemmelig rundt sine
